<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A GONZÓ PROGRAMOZÁS KIÁLTVÁNY / THE GONZO PROGRAMMING MANIFESTO</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0b0811;
      color: #e0d8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.7;
      margin: 0;
      padding: 0;
    }
    .wrapper {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px 80px 20px;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    h1 {
      color: #ffffff;
      text-align: center;
      font-size: 1.9rem;
      margin-top: 25px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    h2, h3 {
      color: #ffffff;
    }
    p, li {
      color: #dcd4e4;
    }
    a {
      color: #00f0ff;
      text-decoration: none;
      transition: color 0.15s;
    }
    a:hover {
      color: #ff3b00;
      text-decoration: underline;
    }
    strong {
      color: #ffffff;
    }
    details {
      background: #150e1f;
      border: 1px solid #362045;
      border-radius: 10px;
      padding: 14px 20px;
      margin: 25px 0;
    }
    summary {
      cursor: pointer;
      font-weight: bold;
      color: #ff5500;
      user-select: none;
      font-size: 1.05rem;
    }
    summary:hover {
      color: #00f0ff;
    }
    hr {
      border: none;
      border-top: 1px solid #2d1838;
      margin: 35px 0;
    }
    ol, ul {
      padding-left: 28px;
    }
    li {
      margin-bottom: 16px;
    }
    div[align="center"] {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    {{ content }}
  </div>
</body>
</html>
